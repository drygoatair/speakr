x-arcane: 
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/speakr.webp
  urls:
    - https://murtaza-nasir.github.io/speakr/
    - https://github.com/murtaza-nasir/speakr

services:
  app:
    build:
      context: .
      args:
        LIGHTWEIGHT: 0  # Set to 1 for a smaller image without PyTorch
    image: speakr:custom  # Tag for your custom build
    container_name: speakr
    restart: unless-stopped
    ports:
      - "8899:8899"
    env_file:
      - .env
    # --- Volume Configuration ---
    volumes:
      - ./uploads:/data/uploads
      - ./instance:/data/instance
      # Optional: Uncomment if using auto-export feature (ENABLE_AUTO_EXPORT=true)
      # - ./exports:/data/exports
      # Optional: Uncomment if using auto-processing feature (ENABLE_AUTO_PROCESSING=true)
      # - ./auto-process:/data/auto-process
    extra_hosts:
      - "host.docker.internal:host-gateway"